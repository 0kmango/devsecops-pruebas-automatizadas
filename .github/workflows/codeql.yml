name: CodeQL

# Análisis estático de seguridad. En un repositorio de la unidad de
# "Ciberseguridad en desarrollo de software" es la parte automática de la "Sec":
# revisa el código en busca de inyecciones, secretos, rutas inseguras, etc.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    name: Analizar Python
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"